# ============================================================
# Chronos — Docker Compose
# ============================================================
# Complete local development environment:
# - Chronos orchestration engine
# - PostgreSQL (durable persistence)
# - Redis (fast coordination)
# - Mock microservices (payment, inventory, shipping)
# ============================================================

services:
  # ── Chronos Engine ──────────────────────────────────────
  Chronos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Chronos
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgresql://Chronos:Chronos@postgres:5432/Chronos
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - Chronos-network

  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: Chronos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: Chronos
      POSTGRES_PASSWORD: Chronos
      POSTGRES_DB: Chronos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Chronos"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - Chronos-network

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: Chronos-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - Chronos-network

  # ── Mock Payment Service ─────────────────────────────────
  # Placeholder — will be fully implemented in Phase 8
  payment-service:
    image: node:20-alpine
    container_name: Chronos-payment
    working_dir: /app
    volumes:
      - ./services/payment-service:/app
    command: sh -c "[ -f package.json ] && npm install && node index.js || echo 'Payment service placeholder — implement in Phase 8' && tail -f /dev/null"
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      SERVICE_NAME: payment-service
    networks:
      - Chronos-network

  # ── Mock Inventory Service ───────────────────────────────
  inventory-service:
    image: node:20-alpine
    container_name: Chronos-inventory
    working_dir: /app
    volumes:
      - ./services/inventory-service:/app
    command: sh -c "[ -f package.json ] && npm install && node index.js || echo 'Inventory service placeholder — implement in Phase 8' && tail -f /dev/null"
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      SERVICE_NAME: inventory-service
    networks:
      - Chronos-network

  # ── Mock Shipping Service ────────────────────────────────
  shipping-service:
    image: node:20-alpine
    container_name: Chronos-shipping
    working_dir: /app
    volumes:
      - ./services/shipping-service:/app
    command: sh -c "[ -f package.json ] && npm install && node index.js || echo 'Shipping service placeholder — implement in Phase 8' && tail -f /dev/null"
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
      SERVICE_NAME: shipping-service
    networks:
      - Chronos-network

# ── Volumes ──────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

# ── Networks ─────────────────────────────────────────────
networks:
  Chronos-network:
    driver: bridge
